<script>

const btn =
document.querySelector(".lang-btn");

const menu =
document.querySelector(".lang-menu");


/* =========================
   TRANSLATIONS
========================= */

const translations = {


/* ENGLISH */

en: {

    langButton:"🌐 EN",

    aboutButton:"WHO WE ARE",

    offersButton:"OUR OFFERS",

    partnerButton:"BECOME A PARTNER",

    footerSlogan:
    "CONNECTING BUSINESSES WORLDWIDE",

    footerServices:
    "Global Trade • International Sourcing • Strategic Partnerships",

    footerCopy:
    "© 2026 FIDDEXA. All Rights Reserved."

},


/* CHINESE */

zh: {

    langButton:"🌐 中文",

    aboutButton:"关于我们",

    offersButton:"我们的业务机会",

    partnerButton:"成为合作伙伴",

    footerSlogan:
    "连接全球企业",

    footerServices:
    "国际贸易 • 全球采购 • 战略合作伙伴关系",

    footerCopy:
    "© 2026 FIDDEXA。版权所有。"

},


/* FRENCH */

fr: {

    langButton:"🌐 FR",

    aboutButton:"QUI SOMMES-NOUS",

    offersButton:"NOS OFFRES",

    partnerButton:"DEVENIR PARTENAIRE",

    footerSlogan:
    "CONNECTER LES ENTREPRISES DANS LE MONDE ENTIER",

    footerServices:
    "Commerce international • Sourcing international • Partenariats stratégiques",

    footerCopy:
    "© 2026 FIDDEXA. Tous droits réservés."

},


/* SPANISH */

es: {

    langButton:"🌐 ES",

    aboutButton:"QUIÉNES SOMOS",

    offersButton:"NUESTRAS OFERTAS",

    partnerButton:"CONVIÉRTETE EN SOCIO",

    footerSlogan:
    "CONECTANDO EMPRESAS EN TODO EL MUNDO",

    footerServices:
    "Comercio internacional • Abastecimiento global • Asociaciones estratégicas",

    footerCopy:
    "© 2026 FIDDEXA. Todos los derechos reservados."

},


/* RUSSIAN */

ru: {

    langButton:"🌐 RU",

    aboutButton:"О КОМПАНИИ",

    offersButton:"НАШИ ПРЕДЛОЖЕНИЯ",

    partnerButton:"СТАТЬ ПАРТНЁРОМ",

    footerSlogan:
    "СОЕДИНЯЕМ БИЗНЕС ПО ВСЕМУ МИРУ",

    footerServices:
    "Международная торговля • Глобальный поиск поставщиков • Стратегические партнёрства",

    footerCopy:
    "© 2026 FIDDEXA. Все права защищены."

},


/* HINDI */

hi: {

    langButton:"🌐 HI",

    aboutButton:"हम कौन हैं",

    offersButton:"हमारे प्रस्ताव",

    partnerButton:"भागीदार बनें",

    footerSlogan:
    "दुनिया भर के व्यवसायों को जोड़ना",

    footerServices:
    "अंतरराष्ट्रीय व्यापार • वैश्विक सोर्सिंग • रणनीतिक साझेदारी",

    footerCopy:
    "© 2026 FIDDEXA. सर्वाधिकार सुरक्षित।"

}

};


/* =========================
   APPLY LANGUAGE
========================= */

function applyLanguage(lang){

    if(!translations[lang]){
        lang = "en";
    }

    const t =
    translations[lang];


    btn.textContent =
    t.langButton;


    document
    .getElementById("btn-about")
    .textContent =
    t.aboutButton;


    document
    .getElementById("btn-offers")
    .textContent =
    t.offersButton;


    document
    .getElementById("btn-partner")
    .textContent =
    t.partnerButton;


    document
    .getElementById("footer-slogan")
    .textContent =
    t.footerSlogan;


    document
    .getElementById("footer-services")
    .textContent =
    t.footerServices;


    document
    .getElementById("footer-copy")
    .textContent =
    t.footerCopy;


    document.documentElement.lang =
    lang;


    localStorage.setItem(
        "language",
        lang
    );


    menu.style.display =
    "none";

}


/* =========================
   LANGUAGE MENU
========================= */

btn.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        menu.style.display =
        menu.style.display === "block"
        ? "none"
        : "block";

    }
);


/* =========================
   LANGUAGE LINKS
========================= */

document
.getElementById("lang-en")
.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        applyLanguage("en");

    }
);


document
.getElementById("lang-zh")
.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        applyLanguage("zh");

    }
);


document
.getElementById("lang-fr")
.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        applyLanguage("fr");

    }
);


document
.getElementById("lang-es")
.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        applyLanguage("es");

    }
);


document
.getElementById("lang-ru")
.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        applyLanguage("ru");

    }
);


document
.getElementById("lang-hi")
.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        applyLanguage("hi");

    }
);


/* =========================
   CLOSE MENU OUTSIDE
========================= */

document.addEventListener(
    "click",
    function(){

        menu.style.display =
        "none";

    }
);


menu.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

    }
);


/* =========================
   LOAD SAVED LANGUAGE
========================= */

const savedLanguage =
localStorage.getItem(
    "language"
);


if(
    savedLanguage &&
    translations[savedLanguage]
){

    applyLanguage(
        savedLanguage
    );

}else{

    applyLanguage(
        "en"
    );

}

        </script>
