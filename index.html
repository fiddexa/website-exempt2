<style>

    .about-button-wrap{

display:flex;
justify-content:center;

margin:45px 0 60px;

}

.about-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;

padding:22px 80px;

font-size:28px;

font-weight:700;

font-family:'Cormorant Garamond',serif;

letter-spacing:3px;

color:#06141a;

background:linear-gradient(
180deg,
#f0d17d,
#d8b05d);

border:none;

border-radius:60px;

cursor:pointer;

box-shadow:

0 8px 30px rgba(216,176,93,.45);

transition:
background .35s,
color .35s,
transform .35s,
box-shadow .35s;

}

.about-btn:hover{

transform:translateY(-3px);

box-shadow:
0 12px 35px rgba(216,176,93,.6);

}
/* =========================
   MAIN NAVIGATION BUTTONS
========================= */

.main-buttons-wrap{

    width:100%;

    max-width:1100px;

    margin:45px auto 60px;

    padding:0 20px;

    display:flex;

    justify-content:center;

    align-items:stretch;

    gap:22px;

}


.main-btn{

    flex:1;

    display:flex;

    align-items:center;

    justify-content:center;

    min-height:72px;

    padding:18px 25px;

    text-align:center;

    text-decoration:none;

    font-family:
    'Cormorant Garamond',
    serif;

    font-size:23px;

    font-weight:700;

    letter-spacing:2px;

    color:#06141a;

    background:
    linear-gradient(
        180deg,
        #f0d17d,
        #d8b05d
    );

    border-radius:60px;

    box-shadow:
    0 8px 30px
    rgba(216,176,93,.35);

    transition:
    transform .3s ease,
    box-shadow .3s ease;

}


.main-btn:hover{

    transform:
    translateY(-3px);

    box-shadow:
    0 12px 35px
    rgba(216,176,93,.55);

}
    
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

    padding-top:90px;

    background:
    linear-gradient(180deg,#06141a,#081d24,#06141a);

    font-family:'Inter',sans-serif;

    color:#f5f5f5;

    overflow-x:hidden;

}

.container{
    width:100%;
    max-width:1920px;
    margin:auto;
    padding:0 0 40px;
}
.hero{

width:100%;

display:block;

border-radius:0 0 18px 18px;

box-shadow:
0 15px 60px rgba(0,0,0,.65);

margin-bottom:55px;

}

footer{

    width:100%;
    max-width:1180px;

    margin:80px auto 0;

    padding:40px 20px 10px;

    text-align:center;

    border-top:
    1px solid rgba(216,176,93,.25);

    color:#b8b8b8;

}


.footer-brand{

    font-family:
    'Cormorant Garamond',
    serif;

    font-size:34px;

    font-weight:600;

    color:#d8b05d;

    letter-spacing:5px;

    margin-bottom:15px;

}


.footer-email{

    margin-bottom:22px;

}


.footer-email a{

    display:inline-flex;

    align-items:center;
    justify-content:center;

    padding:11px 24px;

    border:
    1px solid rgba(216,176,93,.60);

    border-radius:999px;

    color:#d8b05d;

    background:
    rgba(6,24,30,.75);

    text-decoration:none;

    font-family:
    'Inter',
    sans-serif;

    font-size:16px;

    font-weight:600;

    letter-spacing:.5px;

    text-transform:none;

    transition:
    background .3s ease,
    color .3s ease,
    transform .3s ease;

}
    

.footer-email a:hover{

    background:
    rgba(216,176,93,.10);

    color:#f0d17d;

    transform:translateY(-2px);

}


.footer-slogan{

    font-size:15px;

    letter-spacing:2px;

    text-transform:uppercase;

    margin-bottom:12px;

}


.footer-services{

    font-size:14px;

    line-height:1.8;

    letter-spacing:1px;

    opacity:.8;

}


.footer-copy{

    margin-top:30px;

    font-size:12px;

    letter-spacing:1px;

    opacity:.6;

}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .main-buttons-wrap{
        flex-direction:column;
        gap:16px;
        margin:30px auto 20px;
        padding:0 20px;
    }

    .main-btn{
        width:100%;
        min-height:60px;
        padding:15px 20px;
        font-size:21px;
        letter-spacing:1.5px;
    }

    .container{
        padding:0;
    }

    .about-btn{
        padding:16px 36px;
        font-size:22px;
        letter-spacing:2px;
    }

    .hero{
        border-radius:10px;
        margin-bottom:10px;
    }

    footer{
        margin-top:35px;
        padding:35px 10px 10px;
    }

    .footer-brand{
        font-size:30px;
    }

    .footer-email a{
        font-size:15px;
        padding:11px 20px;
    }

    .footer-slogan{
        font-size:13px;
        line-height:1.7;
    }

    .footer-services{
        font-size:12px;
        line-height:1.8;
    }

    .footer-copy{
        font-size:12px;
        margin-top:30px;
    }

}

/* =========================
   INDEX HEADER
========================= */

.top-header{
    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:90px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding-top:16px;

    background:rgba(4,10,20,.88);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    border-bottom:
    1px solid rgba(216,176,93,.18);

    box-shadow:
    0 8px 30px rgba(0,0,0,.25);

    z-index:9999;
}

.logo-link{
    display:inline-block;
    text-decoration:none;
}

.logo-link img{
    width:230px;
    height:auto;
    display:block;

    transition:
    transform .3s ease,
    filter .3s ease;
}

.logo-link img:hover{
    transform:scale(1.04);

    filter:
    drop-shadow(
        0 0 18px rgba(216,176,93,.65)
    );
}

body{
    padding-top:90px;
}
    

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .top-header{
        height:90px;
    }

    body{
        padding-top:90px;
    }

    .logo-link img{
        width:200px;
    }

}


/* =========================
   LANGUAGE SWITCHER
========================= */

.language-switcher{
    position:absolute;
    top:100px;
    right:12px;
    z-index:1000;
}


.lang-btn{
    width:90px;
    height:38px;

    padding:0;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:5px;

    background:rgba(6,24,30,.90);

    color:#d8b05d;

    border:
        1px solid rgba(216,176,93,.45);

    border-radius:999px;

    font-size:13px;
    font-weight:600;

    cursor:pointer;

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}


.lang-menu{
    display:none;

    position:absolute;

    top:52px;
    right:0;

    width:90px;

    background:rgba(6,24,30,.96);

    border:
        1px solid rgba(216,176,93,.35);

    border-radius:14px;

    overflow:hidden;

    box-shadow:
        0 12px 30px rgba(0,0,0,.45);
}


.lang-menu a{
    display:block;

    padding:10px 14px;

    font-size:15px;
    font-weight:500;

    color:#ffffff;

    text-decoration:none;

    transition:
        background .25s ease,
        color .25s ease;
}


.lang-menu a:hover{
    background:rgba(216,176,93,.15);
    color:#d8b05d;
}

</style>

</head>

<body id="top">
    <header class="top-header">

<a href="index.html" class="logo-link">
    <img src="images/fiddexa-title.png" alt="FIDDEXA">
</a>
        
    </header>
    
    <div class="language-switcher">

<button class="lang-btn">
🌐 EN
</button>

<div class="lang-menu">

    <a href="#" id="lang-en">English</a>

    <a href="#" id="lang-zh">中文</a>

    <a href="#" id="lang-fr">Français</a>

    <a href="#" id="lang-es">Español</a>

    <a href="#" id="lang-ru">Русский</a>

    <a href="#" id="lang-hi">हिन्दी</a>

</div>

    </div>

<div class="container">

<img src="images/hero.png" class="hero" alt="FIDDEXA">

    <div class="main-buttons-wrap">

    <a
    href="about.html"
    class="main-btn"
    id="btn-about">
        WHO WE ARE
    </a>

    <a
    href="offers.html"
    class="main-btn"
    id="btn-offers">
        OUR OFFERS
    </a>

    <a
    href="partner.html"
    class="main-btn"
    id="btn-partner">
        BECOME A PARTNER
    </a>

    </div>

</div>

<footer>

    <div class="footer-brand">
        FIDDEXA
    </div>

    <div class="footer-email">
        <a href="mailto:contact@fiddexa.com">
            contact@fiddexa.com
        </a>
    </div>

    <div
    class="footer-slogan"
    id="footer-slogan">
        CONNECTING BUSINESSES WORLDWIDE
    </div>

    <div
    class="footer-services"
    id="footer-services">
        Global Trade • International Sourcing • Strategic Partnerships
    </div>

    <div
    class="footer-copy"
    id="footer-copy">
        © 2026 FIDDEXA. All Rights Reserved.
    </div>

</footer>

</div>

<script>

const btn =
document.querySelector(".lang-btn");

const menu =
document.querySelector(".lang-menu");


/* =========================
   TRANSLATIONS
========================= */

const translations = {


/* ENGLISH */

en: {

    langButton:"🌐 EN",

    aboutButton:"WHO WE ARE",

    offersButton:"OUR OFFERS",

    partnerButton:"BECOME A PARTNER",

    footerSlogan:
    "CONNECTING BUSINESSES WORLDWIDE",

    footerServices:
    "Global Trade • International Sourcing • Strategic Partnerships",

    footerCopy:
    "© 2026 FIDDEXA. All Rights Reserved."

},


/* CHINESE */

zh: {

    langButton:"🌐 中文",

    aboutButton:"关于我们",

    offersButton:"我们的业务机会",

    partnerButton:"成为合作伙伴",

    footerSlogan:
    "连接全球企业",

    footerServices:
    "国际贸易 • 全球采购 • 战略合作伙伴关系",

    footerCopy:
    "© 2026 FIDDEXA。版权所有。"

},


/* FRENCH */

fr: {

    langButton:"🌐 FR",

    aboutButton:"QUI SOMMES-NOUS",

    offersButton:"NOS OFFRES",

    partnerButton:"DEVENIR PARTENAIRE",

    footerSlogan:
    "CONNECTER LES ENTREPRISES DANS LE MONDE ENTIER",

    footerServices:
    "Commerce international • Sourcing international • Partenariats stratégiques",

    footerCopy:
    "© 2026 FIDDEXA. Tous droits réservés."

},


/* SPANISH */

es: {

    langButton:"🌐 ES",

    aboutButton:"QUIÉNES SOMOS",

    offersButton:"NUESTRAS OFERTAS",

    partnerButton:"CONVIÉRTETE EN SOCIO",

    footerSlogan:
    "CONECTANDO EMPRESAS EN TODO EL MUNDO",

    footerServices:
    "Comercio internacional • Abastecimiento global • Asociaciones estratégicas",

    footerCopy:
    "© 2026 FIDDEXA. Todos los derechos reservados."

},


/* RUSSIAN */

ru: {

    langButton:"🌐 RU",

    aboutButton:"О КОМПАНИИ",

    offersButton:"НАШИ ПРЕДЛОЖЕНИЯ",

    partnerButton:"СТАТЬ ПАРТНЁРОМ",

    footerSlogan:
    "СОЕДИНЯЕМ БИЗНЕС ПО ВСЕМУ МИРУ",

    footerServices:
    "Международная торговля • Глобальный поиск поставщиков • Стратегические партнёрства",

    footerCopy:
    "© 2026 FIDDEXA. Все права защищены."

},


/* HINDI */

hi: {

    langButton:"🌐 HI",

    aboutButton:"हम कौन हैं",

    offersButton:"हमारे प्रस्ताव",

    partnerButton:"भागीदार बनें",

    footerSlogan:
    "दुनिया भर के व्यवसायों को जोड़ना",

    footerServices:
    "अंतरराष्ट्रीय व्यापार • वैश्विक सोर्सिंग • रणनीतिक साझेदारी",

    footerCopy:
    "© 2026 FIDDEXA. सर्वाधिकार सुरक्षित।"

}

};


/* =========================
   APPLY LANGUAGE
========================= */

function applyLanguage(lang){

    if(!translations[lang]){
        lang = "en";
    }

    const t =
    translations[lang];


    btn.textContent =
    t.langButton;


    document
    .getElementById("btn-about")
    .textContent =
    t.aboutButton;


    document
    .getElementById("btn-offers")
    .textContent =
    t.offersButton;


    document
    .getElementById("btn-partner")
    .textContent =
    t.partnerButton;


    document
    .getElementById("footer-slogan")
    .textContent =
    t.footerSlogan;


    document
    .getElementById("footer-services")
    .textContent =
    t.footerServices;


    document
    .getElementById("footer-copy")
    .textContent =
    t.footerCopy;


    document.documentElement.lang =
    lang;


    localStorage.setItem(
        "language",
        lang
    );


    menu.style.display =
    "none";

}


/* =========================
   LANGUAGE MENU
========================= */

btn.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        menu.style.display =
        menu.style.display === "block"
        ? "none"
        : "block";

    }
);


/* =========================
   LANGUAGE LINKS
========================= */

document
.getElementById("lang-en")
.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        applyLanguage("en");

    }
);


document
.getElementById("lang-zh")
.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        applyLanguage("zh");

    }
);


document
.getElementById("lang-fr")
.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        applyLanguage("fr");

    }
);


document
.getElementById("lang-es")
.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        applyLanguage("es");

    }
);


document
.getElementById("lang-ru")
.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        applyLanguage("ru");

    }
);


document
.getElementById("lang-hi")
.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        applyLanguage("hi");

    }
);


/* =========================
   CLOSE MENU OUTSIDE
========================= */

document.addEventListener(
    "click",
    function(){

        menu.style.display =
        "none";

    }
);


menu.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

    }
);


/* =========================
   LOAD SAVED LANGUAGE
========================= */

const savedLanguage =
localStorage.getItem(
    "language"
);


if(
    savedLanguage &&
    translations[savedLanguage]
){

    applyLanguage(
        savedLanguage
    );

}else{

    applyLanguage(
        "en"
    );

}

        </script>

</body>

</html>
