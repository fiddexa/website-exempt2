display:inline-flex;

<div style="font-size:16px;
letter-spacing:2px;
margin-bottom:18px;">

<div id="footer-slogan">
CONNECTING BUSINESSES WORLDWIDE

</div>

<div style="opacity:.8;
line-height:1.8;">

<div id="footer-services">
Global Trade • International Sourcing • Strategic Partnerships
</div>

<div style="margin-top:35px;
font-size:14px;
opacity:.6;">

<div id="footer-copy">
© 2026 FIDDEXA. All Rights Reserved.
</div>

</div>

</div>

</div>

</footer>

</div>

<script>

const btn = document.querySelector(".lang-btn");
const menu = document.querySelector(".lang-menu");
const savedLanguage = localStorage.getItem("language");
const english = {

footerSlogan:"CONNECTING BUSINESSES WORLDWIDE",

footerServices:"Global Trade • International Sourcing • Strategic Partnerships",

footerCopy:"© 2026 FIDDEXA. All Rights Reserved."

};
    
const chinese = {

footerSlogan: "连接全球企业",

footerServices: "国际贸易 • 全球采购 • 战略合作伙伴关系",

footerCopy: "© 2026 FIDDEXA。版权所有。"

};


btn.addEventListener("click", function(e){
    e.stopPropagation();

    if(menu.style.display==="block"){
        menu.style.display="none";
    }else{
        menu.style.display="block";
    }
});

document.addEventListener("click", function(){
    menu.style.display="none";
});

menu.addEventListener("click", function(e){
    e.stopPropagation();
});

document.getElementById("lang-en").addEventListener("click", function(e){

    e.preventDefault();

    btn.innerHTML = "🌐 EN";

document.getElementById("footer-slogan").innerText = english.footerSlogan;
document.getElementById("footer-services").innerText = english.footerServices;
document.getElementById("footer-copy").innerText = english.footerCopy;
    localStorage.setItem("language","en");

    menu.style.display="none";

});

document.getElementById("lang-zh").addEventListener("click", function(e){

    e.preventDefault();

    btn.innerHTML = "🌐 中文";
    
document.getElementById("footer-slogan").innerText = chinese.footerSlogan;
document.getElementById("footer-services").innerText = chinese.footerServices;
document.getElementById("footer-copy").innerText = chinese.footerCopy;
    localStorage.setItem("language","zh");

    menu.style.display="none";

});


    if(savedLanguage==="zh"){

document.getElementById("lang-zh").click();

}else{

document.getElementById("lang-en").click();

    }

</script>
